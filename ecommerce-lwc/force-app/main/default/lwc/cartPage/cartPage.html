<template>

    <div class="cart-container">

        <h1>Shopping Cart</h1>

      <template if:true={hasCartItems}>

    <div class="cart-layout">

        <div class="cart-items">

            <template for:each={cartItems} for:item="item">

                <div key={item.id} class="cart-card">

                    <div class="product-info">

                        <h2>{item.name}</h2>

                        <p>{item.category}</p>

                        <p>₹ {item.price}</p>

                        <div class="qty-box">

                            <button
                                data-id={item.id}
                                onclick={decreaseQty}>
                                -
                            </button>

                            <span>{item.quantity}</span>

                            <button
                                data-id={item.id}
                                onclick={increaseQty}>
                                +
                            </button>

                        </div>

                    </div>

                    <button
                        class="remove-btn"
                        data-id={item.id}
                        onclick={removeItem}>

                        Remove

                    </button>

                </div>

            </template>

        </div>

       <div class="cart-summary">

    <h2>Order Summary</h2>

    <div class="summary-row">
        <span>Items</span>
        <span>{cartItems.length}</span>
    </div>

    <div class="summary-row">
        <span>Total</span>
        <span>₹ {cartTotal}</span>
    </div>

    <div class="summary-buttons">

        <lightning-button
            label="Continue Shopping"
            onclick={goToProducts}>
        </lightning-button>

        <lightning-button
    variant="brand"
    label="Proceed To Checkout"
    onclick={goToCheckout}>
</lightning-button>

    </div>

</div>

    </div>

</template>

        <template if:false={hasCartItems}>

            <div class="empty-cart">

                <h2>Your Cart Is Empty</h2>

            </div>

        </template>

    </div>

</template>

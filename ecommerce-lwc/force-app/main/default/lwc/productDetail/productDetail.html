<template>
  <section class="product-detail-page">
    <template if:true={isLoading}>
      <div class="loading-shell slds-align_absolute-center">
        <lightning-spinner alternative-text="Loading product details" size="large"></lightning-spinner>
        <p class="loading-text">Loading product details...</p>
      </div>
    </template>

    <template if:true={errorMessage}>
      <div class="error-panel slds-box slds-theme_alert-texture slds-theme_error">
        <h2 class="slds-text-heading_medium">Product unavailable</h2>
        <p>{errorMessage}</p>
      </div>
    </template>

    <template if:true={hasProduct}>
      <div class="breadcrumb-shell slds-grid slds-grid_align-spread slds-wrap">
        <div class="breadcrumb-links">
          <a href="/" class="breadcrumb-link">Home</a>
          <span class="breadcrumb-separator">›</span>
          <a href="/products" class="breadcrumb-link">Products</a>
          <span class="breadcrumb-separator">›</span>
          <span class="breadcrumb-current">{product.Name}</span>
        </div>
        <button class="back-button slds-button slds-button_inverse" onclick={handleBackToProducts}>
          ← Back To Products
        </button>
      </div>

      <div class="page-hero slds-grid slds-wrap slds-gutters_small">
        <div class="gallery-card slds-col slds-size_1-of-1 slds-large-size_6-of-12">
          <div class="image-shell slds-box card-elevated">
            <img
              src={mainImageUrl}
              alt={product.Name}
              class="main-image"
            />
          </div>
          <div class="thumbnail-row slds-grid slds-grid_align-spread slds-m-top_small">
            <template for:each={imageGalleryData} for:item="image">
              <button
                key={image.index}
                class={image.className}
                data-index={image.index}
                onclick={handleThumbnailClick}
                title={image.title}
                aria-label={image.ariaLabel}
              >
                <img src={image.url} alt={image.alt} />
              </button>
            </template>
          </div>
        </div>

        <div class="info-card slds-col slds-size_1-of-1 slds-large-size_6-of-12">
          <div class="top-panel slds-box card-elevated">
            <div class="product-header slds-grid slds-grid_align-spread slds-wrap">
              <div class="title-block">
                <p class="category-pill">{product.Category__c}</p>
                <h1 class="product-title">{product.Name}</h1>
              </div>
              <button
                class={wishlistButtonClass}
                onclick={handleToggleWishlist}
                aria-pressed={wishlistActive}
                title={wishlistButtonLabel}
              >
                <span class="heart-icon">{wishlistIcon}</span>
                <span class="slds-assistive-text">{wishlistButtonLabel}</span>
              </button>
            </div>

            <div class="rating-row slds-grid slds-grid_vertical-align-center slds-wrap">
              <div class="rating-score">
                <span class="rating-value">{ratingAverage}</span>
                <span class="rating-stars">★★★★★</span>
              </div>
              <div class="rating-meta">({reviewCount} Reviews)</div>
            </div>

            <p class="product-description">{shortDescription}</p>

            <div class="price-stock-row slds-grid slds-grid_align-spread slds-wrap">
              <div class="price-block">
                <span class="price-label">Price</span>
                <p class="price-value">{productPrice}</p>
              </div>
              <div class="stock-block">
                <span class="stock-label">Availability</span>
                <p class={availabilityClass}>{availabilityLabel}</p>
              </div>
            </div>

            <div class="sku-row slds-m-top_x-small">
              <span class="sku-label">SKU</span>
              <span class="sku-value">{skuValue}</span>
            </div>

            <div class="quantity-shell slds-grid slds-grid_align-center slds-m-top_medium">
              <span class="quantity-label">Quantity</span>
              <div class="quantity-controls slds-grid slds-grid_vertical-align-center">
                <button
                  class="quantity-button slds-button slds-button_neutral"
                  onclick={handleDecrease}
                  disabled={isQuantityMinimum}
                  aria-label="Decrease quantity"
                >
                  −
                </button>
                <span class="quantity-value">{selectedQuantity}</span>
                <button
                  class="quantity-button slds-button slds-button_neutral"
                  onclick={handleIncrease}
                  disabled={isQuantityMaximum}
                  aria-label="Increase quantity"
                >
                  +
                </button>
              </div>
              <span class="stock-badge">{product.Stock__c} available</span>
            </div>

            <div class="action-buttons slds-grid slds-grid_align-spread slds-wrap slds-m-top_medium">
              <button
                class="slds-button slds-button_brand add-cart-button"
                onclick={handleAddToCart}
                disabled={isOutOfStock}
              >
                Add To Cart
              </button>
              <button
                class="slds-button slds-button_inverse buy-now-button"
                onclick={handleBuyNow}
                disabled={isOutOfStock}
              >
                Buy Now
              </button>
            </div>
          </div>

          <div class="specs-panel slds-box card-elevated slds-m-top_medium">
            <h2 class="section-heading">Product Specifications</h2>
            <div class="spec-grid slds-grid slds-wrap">
              <template for:each={specRows} for:item="spec">
                <div key={spec.label} class="spec-row slds-size_1-of-2 slds-medium-size_1-of-3">
                  <span class="spec-label">{spec.label}</span>
                  <span class="spec-value">{spec.value}</span>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>

      <div class="detail-sections">
        <section class="description-section slds-box card-elevated">
          <div class="section-heading-row slds-grid slds-grid_align-spread slds-wrap">
            <h2 class="section-heading">Product Description</h2>
            <button class="toggle-button slds-button slds-button_neutral" onclick={handleReadMoreToggle}>
              {descriptionToggleLabel}
            </button>
          </div>
          <p class="description-text">{descriptionText}</p>
        </section>

        <section class="related-section slds-box card-elevated slds-m-top_medium">
          <div class="section-heading-row slds-grid slds-grid_align-spread slds-wrap">
            <h2 class="section-heading">Related Products</h2>
            <span class="section-meta">Products from the same category</span>
          </div>
          <div class="cards-grid slds-grid slds-wrap">
            <template if:true={relatedProductsList.length}>
              <template for:each={relatedProductsList} for:item="item">
                <article key={item.id} class="product-card slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 card-elevated">
                  <img src={item.imageUrl} alt={item.name} class="card-image" />
                  <div class="card-body">
                    <p class="card-category">{item.category}</p>
                    <h3>{item.name}</h3>
                    <div class="card-meta">
                      <span class="card-price">{item.price}</span>
                      <span class="card-rating">★ {item.rating}</span>
                    </div>
                    <div class="card-actions">
                      <button class="slds-button slds-button_neutral" data-id={item.id} onclick={handleRelatedViewDetails}>View Details</button>
                      <button class="slds-button slds-button_brand" data-id={item.id} onclick={handleRelatedAddToCart}>Add To Cart</button>
                    </div>
                  </div>
                </article>
              </template>
            </template>
            <template if:false={relatedProductsList.length}>
              <div class="empty-state">No related products are available for this category.</div>
            </template>
          </div>
        </section>

        <section class="recommended-section slds-box card-elevated slds-m-top_medium">
          <div class="section-heading-row slds-grid slds-grid_align-spread slds-wrap">
            <h2 class="section-heading">You May Also Like</h2>
            <span class="section-meta">AI-driven recommendations</span>
          </div>
          <div class="cards-grid slds-grid slds-wrap">
            <template for:each={recommendedProducts} for:item="item">
              <article key={item.id} class="recommend-card slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 card-elevated">
                <img src={item.imageUrl} alt={item.name} class="card-image" />
                <div class="card-body">
                  <h3>{item.name}</h3>
                  <div class="card-meta">
                    <span class="card-price">{item.price}</span>
                    <span class="card-rating">★ {item.rating}</span>
                  </div>
                </div>
              </article>
            </template>
          </div>
        </section>

        <section class="reviews-section slds-box card-elevated slds-m-top_medium">
          <div class="section-heading-row slds-grid slds-grid_align-spread slds-wrap">
            <h2 class="section-heading">Customer Reviews</h2>
            <button class="slds-button slds-button_neutral" onclick={handleWriteReview}>Write Review</button>
          </div>
          <div class="review-summary slds-grid slds-wrap slds-grid_align-spread">
            <div class="average-score">
              <span class="score-value">{ratingAverage}</span>
              <span class="score-label">Average Rating</span>
            </div>
            <div class="review-count">{reviewCount} reviews</div>
          </div>
          <div class="review-list slds-grid slds-wrap">
            <template for:each={reviews} for:item="review">
              <article key={review.id} class="review-card slds-col slds-size_1-of-1 slds-medium-size_1-of-2 card-elevated">
                <div class="review-header">
                  <span class="review-author">{review.author}</span>
                  <span class="review-rating">{review.rating} ★</span>
                </div>
                <p class="review-text">{review.text}</p>
              </article>
            </template>
          </div>
        </section>
      </div>
    </template>
  </section>
</template>
